[project]
name = "labdata-site"
version = "0.0.0"
description = "Demo Jekyll renderer for documents produced by labdata"
requires-python = ">=3.10"
dependencies = [
    # The one place labdata is pinned, to an immutable tag. uv.lock is the
    # generated resolution to a commit; regenerate it with `uv lock`.
    "labdata @ git+https://github.com/siddhss5/labdata@schema-v4",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
