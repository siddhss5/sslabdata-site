name: Build

# Builds the Example Lab demo end to end and uploads it as a Pages artifact.
# Called by pages.yml and release-gate.yml; it never deploys.

on:
  workflow_call:
    inputs:
      labdata_ref:
        description: >-
          labdata git ref (tag, branch or commit) to build against instead of
          the pin in pyproject.toml. Empty means the pin.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: "0.12.15"

    # --locked fails if uv.lock does not match pyproject.toml, so a changed
    # pin cannot silently build the commit the old lockfile resolved.
    - name: Install pinned labdata
      run: |
        uv sync --locked

    - name: Install candidate labdata
      if: inputs.labdata_ref != ''
      env:
        LABDATA_REF: ${{ inputs.labdata_ref }}
      run: |
        uv pip install --reinstall-package labdata "labdata @ git+https://github.com/siddhss5/labdata@${LABDATA_REF}"

    # Later steps use --no-sync so a candidate labdata is not replaced by the pin.
    - name: Show labdata version
      run: |
        uv run --no-sync python -c "from importlib.metadata import distribution as d; x = d('labdata'); print(x.version, x.read_text('direct_url.json'))"

    - name: Run tests
      run: |
        uv run --no-sync pytest

    - name: Validate demo lab
      run: |
        uv run --no-sync labdata --config demo/lab.yaml --validate

    - name: Generate site data
      run: |
        uv run --no-sync labdata --config demo/lab.yaml --output site/_data/lab.yml
        uv run --no-sync python scripts/generate_site_config.py demo/lab.yaml site/_config.generated.yml

    # actions/jekyll-build-pages only reads site/_config.yml, so build with
    # Jekyll directly to layer the settings generated from lab.yaml on top.
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        # Installs the gems pinned in site/Gemfile.lock (frozen) and caches them.
        bundler-cache: true
        working-directory: site

    - name: Build Jekyll site
      working-directory: site
      env:
        BUNDLE_FROZEN: 'true'
        JEKYLL_ENV: production
        JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        PAGES_REPO_NWO: ${{ github.repository }}
      run: bundle exec jekyll build --config _config.yml,_config.generated.yml --destination ../_site

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
