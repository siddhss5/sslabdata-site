name: External links

# Reports the external links in the built demo that do not answer. It needs
# the network, so it runs on demand and weekly, never on a pull request, and
# never fails on what it finds.

on:
  workflow_dispatch:
  schedule:
  - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  check:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Download built site
      uses: actions/download-artifact@v8
      with:
        name: github-pages

    # Report only: a crash in the script does not fail the run either.
    - name: Report external links
      continue-on-error: true
      run: |
        mkdir _site && tar -xf artifact.tar -C _site
        python scripts/check_external_links.py _site
