name: Pages

# Builds the demo on every pull request and push to main; deploys it to
# GitHub Pages on push to main and on manual dispatch.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per ref, so an older build on main cannot finish after a
# newer one and deploy stale output. Superseded pull request builds are
# cancelled; runs on main are not. Pull requests have their own group, so they
# never cancel a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
