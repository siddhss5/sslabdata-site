theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "default"

# title, description, url and baseurl come from lab.yaml via
# _config.generated.yml (see scripts/generate_site_config.py). Build with:
#   bundle exec jekyll build --config _config.yml,_config.generated.yml
# The empty defaults below stop jekyll-github-metadata (loaded by
# github-pages) from fetching them from the GitHub API, so the build needs
# no network.
title: ""
description: ""
url: ""

plugins:
  - jekyll-include-cache

# Read Markdown pages from _pages/, and the entity pages
# scripts/generate_pages.py writes to _entities/
include:
  - _pages
  - _entities

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
  - scope:
      path: "_entities"
    values:
      layout: single
      classes: wide
